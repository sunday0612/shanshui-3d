    * { box-sizing: border-box; margin: 0; padding: 0; }

      padding: 28px 36px 20px;

        0 1px 0 rgba(255,255,255,0.75),

        0 2px 10px rgba(40,30,16,0.35);
      background: linear-gradient(180deg, rgba(220,226,218,0.55) 0%, rgba(220,226,218,0.0) 100%);

      font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
      font-size: 42px; font-weight: 400; letter-spacing: 0.12em;
      color: #3a2a1a; line-height: 1.15;
    }
    #ui .rule {
      width: 72px; height: 1px; margin: 10px 0 12px;
      background: linear-gradient(90deg, #8a6a2a, rgba(138,106,42,0));
    }
    #ui .poem {
      font-family: "Noto Serif SC", serif;
      font-size: 13px; letter-spacing: 0.28em;
      color: #4a4538; margin-bottom: 14px;
    }
    #ui .hint {
      font-family: "Noto Serif SC", serif;
      font-size: 12px; letter-spacing: 0.16em;
      color: #5a574c; opacity: 0.9;
    }
    #loading {
      position: absolute; inset: 0; z-index: 3;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      background: #bfe0ee; color: #3a2a1a;
      font-family: "Noto Serif SC", serif; letter-spacing: 0.3em;
      transition: opacity 0.8s ease;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
